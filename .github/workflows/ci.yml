name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Networthy is a thin host + finance module on Plenipo platform packages, restored from the
# committed .packages feed (current version only). The branded frontend is also checked from
# its locked source dependencies so vulnerable build tooling cannot silently return.
jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Networthy.slnx

      - name: Audit .NET dependencies
        run: |
          report="$(dotnet list Networthy.slnx package --vulnerable --include-transitive --format json)"
          echo "$report"
          if echo "$report" | jq -e '[.. | objects | .vulnerabilities? // empty] | any(length > 0)' >/dev/null; then
            echo "Vulnerable .NET packages detected."
            exit 1
          fi

      - name: Build (Release)
        run: dotnet build Networthy.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Networthy.slnx -c Release --no-build --verbosity normal

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend/networthy-ui
        run: pnpm install --frozen-lockfile

      # Waived GHSAs live in pnpm-workspace.yaml (auditConfig.ignoreGhsas), each with its
      # rationale — currently three react-router 6.x advisories that have NO fixed 6.x
      # release. Remove the waivers with the react-router 7 migration.
      - name: Audit frontend dependencies
        working-directory: frontend/networthy-ui
        run: pnpm audit --audit-level=moderate

      - name: Test frontend
        working-directory: frontend/networthy-ui
        run: pnpm test

      - name: Build frontend
        working-directory: frontend/networthy-ui
        run: pnpm build

      # The bundle under src/Networthy.Host/wwwroot/app is COMMITTED (scripts/build-ui.ps1), so a
      # clone runs without pnpm. Nothing used to connect it to the source it was built from: the
      # path stays clean in `git status` however far the frontend moves, so the shipped artifact
      # silently rots. It reached EIGHT commits stale (#174) — the dev identity picker and three
      # merged user-facing fixes were in `main` and in no user's browser.
      #
      # The step above already produced the authoritative build; this just refuses to let it differ
      # from what ships. The app's only build-time input is VITE_BRAND_NAME, which vite.config.ts
      # defaults to "Networthy", so a bare `pnpm build` here reproduces what build-ui.ps1 embeds.
      - name: Check embedded bundle matches the frontend source
        run: |
          if ! diff -r frontend/networthy-ui/dist src/Networthy.Host/wwwroot/app; then
            echo "::error::The committed bundle in src/Networthy.Host/wwwroot/app is stale."
            echo "Rebuild and commit it:  ./scripts/build-ui.ps1"
            exit 1
          fi
          echo "Embedded bundle is current."
