# The merger, on a schedule. Deterministic — no AI and no third-party actions. Its write token is a
# user PAT so GitHub emits synchronize and push events that GITHUB_TOKEN deliberately suppresses.
#
# Runs the same `merge-gate.mjs` that `/plenipo:ship` runs locally, so merging keeps working when the
# machine that wrote the code is asleep, and so there is exactly ONE implementation of the gate list.
#
# It merges nothing until `autonomy.level` in workflow.json is >= 1. The deterministic gate reads
# required checks, holds, mergeability and the repository's autonomy ceiling directly; advisory model
# reviews are deliberately outside the merge authority path. Turn the whole thing off with the
# repository variable AGENT_AUTOMERGE=off (Settings -> Variables), no commit required.
#
# Deliberately NOT `pull_request`-triggered: a schedule re-reads the world instead of trusting an
# event payload, so a check that turns red after the review still blocks the merge.
name: Agent merge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# `actions: write` is what lets the last step dispatch `ci.yml`. It is the whole reason a bot merge
# can leave a VERIFIED `main` behind: a merge made with GITHUB_TOKEN raises no `push` event that
# starts a workflow (GitHub's anti-recursion rule), and `workflow_dispatch` is one of the two
# documented exceptions to it. See `ensure-base-checked.mjs` — networthy#181.
permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  # Not optional, and not obvious. GitHub closes a `Closes #N` issue AS THE MERGING ACTOR, so a
  # `GITHUB_TOKEN` merge without this closes the pull request and silently leaves the issue open —
  # the board then advertises merged work forever and the next tick re-reads it as still to do.
  # It fails quietly, on the happy path, which is why it survived eight days of green runs.
  issues: write

concurrency:
  group: agent-merge
  cancel-in-progress: false

jobs:
  triage-recovery:
    name: Recover incomplete issue triage
    if: vars.AGENT_TRIAGE_RECOVERY != 'off'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Issue events are still the fast path. This job bootstraps or renews a current-policy run,
      # or re-runs a completed no-verdict attempt behind exponential backoff and a two-item cap.
      - name: Recover missing triage verdicts
        run: node .github/scripts/triage-retry.mjs --recover
        env:
          GH_TOKEN: ${{ github.token }}

  merge:
    name: Merge what passes every gate
    if: vars.AGENT_AUTOMERGE != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Dry run first, so the log always records what WOULD have happened even when the merge step
      # is skipped or fails. `--merge` re-evaluates every gate before touching anything.
      - name: Evaluate the gates
        run: node .github/scripts/merge-gate.mjs
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}

      - name: Merge
        run: node .github/scripts/merge-gate.mjs --merge
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}

      # A merge made here leaves `main` with NO checks, and `main_is_green` fails closed on that —
      # so without this step the merger locks itself out after exactly one merge. `always()` because
      # the merge step can fail after a commit has already landed, which is precisely when the base
      # is left unverified. The script decides on the commit's check count, not on whether this run
      # merged anything, so it also repairs a `main` an earlier tick already stranded.
      #
      # Deliberately GITHUB_TOKEN, not the merge steps' `COPILOT_GITHUB_TOKEN || github.token`:
      # this step only dispatches `ci.yml`, and `actions: write` above guarantees GITHUB_TOKEN can,
      # whereas a PAT would need `workflow` scope to do the same and fails 403 without it.
      - name: Leave a verified base behind
        if: always()
        run: node .github/scripts/ensure-base-checked.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
