# The merger, on a schedule. Deterministic — no AI, no secrets, no third-party actions.
#
# Runs the same `merge-gate.mjs` that `/plenipo:ship` runs locally, so merging keeps working when the
# machine that wrote the code is asleep, and so there is exactly ONE implementation of the gate list.
#
# It merges nothing until `autonomy.level` in workflow.json is >= 1, and it can never merge a feature
# PR that lacks the `agent:approved` label. That label is applied by `product-pr-intent-review`,
# which reviews every PR here in CI — the loop is not allowed to depend on a developer running
# `/plenipo:ship` from a laptop, because a merger that only works while someone is awake is not a
# merger. Dependency bumps take their own lane: see the header of `merge-gate.mjs`.
#
# Turn the whole thing off with the repository variable AGENT_AUTOMERGE=off (Settings -> Variables),
# no commit required.
#
# Deliberately NOT `pull_request`-triggered: a schedule re-reads the world instead of trusting an
# event payload, so a check that turns red after the review still blocks the merge.
name: Agent merge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# `actions: write` is what lets the last step dispatch `ci.yml`. It is the whole reason a bot merge
# can leave a VERIFIED `main` behind: a merge made with GITHUB_TOKEN raises no `push` event that
# starts a workflow (GitHub's anti-recursion rule), and `workflow_dispatch` is one of the two
# documented exceptions to it. See `ensure-base-checked.mjs` — networthy#181.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge what passes every gate
    if: vars.AGENT_AUTOMERGE != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Dry run first, so the log always records what WOULD have happened even when the merge step
      # is skipped or fails. `--merge` re-evaluates every gate before touching anything.
      - name: Evaluate the gates
        run: node .github/scripts/merge-gate.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        run: node .github/scripts/merge-gate.mjs --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made here leaves `main` with NO checks, and `main_is_green` fails closed on that —
      # so without this step the merger locks itself out after exactly one merge. `always()` because
      # the merge step can fail after a commit has already landed, which is precisely when the base
      # is left unverified. The script decides on the commit's check count, not on whether this run
      # merged anything, so it also repairs a `main` an earlier tick already stranded.
      - name: Leave a verified base behind
        if: always()
        run: node .github/scripts/ensure-base-checked.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
